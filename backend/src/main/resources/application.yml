server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3389/tuanjian_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6462
      password: redis123
      timeout: 6000ms

logging:
  level:
    com.example.tuanjian: DEBUG
    org.hibernate.SQL: DEBUG

# 团建预算池首次启动时的初始总额
tuanjian:
  budget:
    initial-total: 200000.00